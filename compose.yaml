services:
  demo:
    build:
      context: .
      target: runtime
    image: psi-lab:runtime
    volumes:
      - ./out:/out
  tests:
    build:
      context: .
      target: dev
    image: psi-lab:dev
  notebook:
    build:
      context: .
      target: dev
    image: psi-lab:dev
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root