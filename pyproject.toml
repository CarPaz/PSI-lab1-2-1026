[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "psi-lab"
version = "0.1.0"
description = "Laboratorios de Procesamiento de Senales e Imagenes (13318), USACH"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nombre Apellido", email = "nombre.apellido@usach.cl" }]
dependencies = [
"numpy>=1.26",
"matplotlib>=3.8",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
notebook = ["jupyterlab"]

[project.scripts]

psi-demo = "psi_lab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]